plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv("KEYSTORE_PATH")
def storePass = System.getenv("STORE_PASS")
def keyPass = System.getenv("KEY_PASS")
def keyAlias = System.getenv("KEY_ALIAS")

android {
    namespace 'com.fx991cnx.fang'
    compileSdk 34

    defaultConfig {
        applicationId "com.fx991cnx.fang"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "1.0.8"
    }

    signingConfigs {
        release {
            if (keystorePath != null && storePass != null && keyPass != null && keyAlias != null) {
                storeFile file(keystorePath)
                storePassword storePass
                keyAlias keyAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
