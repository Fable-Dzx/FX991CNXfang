name: Build FX-991CN X Windows

on:
  push:
    branches: [ windows ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build portable exe
        run: npx electron-builder --win portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: FX991CNX-Windows
          path: dist/FX991CNX-Windows.exe
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0.${{ github.run_number }}
          name: FX-991CN X Windows v1.0.${{ github.run_number }}
          body: |
            自动构建版（来自 commit ${{ github.sha }}）

            - 网页源码：https://github.com/Fable-Dzx/FX-991-CNX
            - 便携版：FX991CNX-Windows.exe（免安装，双击运行）
          files: dist/FX991CNX-Windows.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
