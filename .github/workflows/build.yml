name: Build FX-991CN X APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Debug list assets
        run: |
          echo "=== assets root ==="
          ls -la app/src/main/assets/
          echo "=== all asset files ==="
          find app/src/main/assets -type f | sort
          echo "=== count ==="
          find app/src/main/assets -type f | wc -l

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --rerun-tasks

      - name: List built APK contents
        run: |
          echo "=== APK contents ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FX991CNXfang-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
