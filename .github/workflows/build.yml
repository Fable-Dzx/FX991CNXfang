name: Build FX-991CN X APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --rerun-tasks

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FX991CNX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FX991CNX-apk
          path: app/build/outputs/apk/debug/FX991CNX.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: FX-991CN X Android v1.0.${{ github.run_number }}
          body: |
            自动构建版（来自 commit ${{ github.sha }}）

            - 网页源码：https://github.com/Fable-Dzx/FX-991-CNX
            - 安装包：FX991CNX.apk（debug 签名）
          files: app/build/outputs/apk/debug/FX991CNX.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
